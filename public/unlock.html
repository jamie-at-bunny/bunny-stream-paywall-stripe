<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enter your access code</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <h1>Enter your access code</h1>
      <p>It's in the email we sent when you bought the video.</p>

      <div class="card">
        <form method="post" action="/unlock">
          <input name="code" aria-label="Access code" autocomplete="off" required />
          <button type="submit">Watch</button>
        </form>
        <p><a href="/">Don't have a code? Buy the video</a></p>
      </div>
    </main>

    <footer>
      <a href="https://github.com/jamie-at-bunny/bunny-stream-paywall-stripe">
        <img src="/bunny.svg" alt="bunny.net" />
        <span class="plus" aria-hidden="true">+</span>
        <img src="/stripe.svg" alt="Stripe" />
        <span class="source">View the source on GitHub</span>
      </a>
    </footer>
  </body>
</html>
